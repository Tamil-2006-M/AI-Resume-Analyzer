# ==================================================================
# pytest configuration
# ==================================================================
# Run the whole suite with:   pytest
# Run one file with:          pytest tests/test_ats_scorer.py
# See each test name with:    pytest -v
# ==================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q        quieter output
# --tb=short  short tracebacks; the full ones are very noisy
# --strict-markers  a typo in a @pytest.mark name becomes an error
addopts = -q --tb=short --strict-markers

markers =
    slow: tests that take more than a second
